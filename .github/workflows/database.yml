name: Database

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"

permissions:
  contents: read

concurrency:
  group: database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Migrations, lint and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.115.0

      - name: Start local Postgres
        run: supabase db start

      - name: Lint database functions
        run: supabase db lint --local --level error

      - name: Test schema and tenant isolation
        run: supabase test db --local

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
