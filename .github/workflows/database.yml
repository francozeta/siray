name: Database

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"

permissions:
  contents: read

concurrency:
  group: database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Migrations, lint and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.115.0

      - name: Start local Postgres
        run: supabase db start

      - name: Lint database functions
        run: supabase db lint --local --level error

      - name: Test schema, invariants and tenant isolation
        run: supabase test db --local

      - name: Verify generated database types
        run: |
          supabase gen types typescript --local --schema api > /tmp/database.types.ts
          diff --unified lib/supabase/database.types.ts /tmp/database.types.ts

      - name: Upload generated types on mismatch
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generated-database-types
          path: /tmp/database.types.ts
          if-no-files-found: ignore
          retention-days: 1

      - name: Stop local Supabase services
        if: always()
        run: supabase stop --no-backup
